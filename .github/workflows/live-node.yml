name: Live node check

# Talks to the real XTE network: node list, /info, /getwalletsyncdata, global indexes,
# random outputs, transaction status, and builds (but never broadcasts) a ring-signed
# transaction using real decoys. Separate from CI so that a node outage does not block merges.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      host:
        description: "Node host (empty = default node, then the public node list)"
        default: ""
      port:
        description: Node port
        default: "443"
      scheme:
        description: "ssl or plain"
        default: ssl
      strict:
        description: "Fail if this node is down instead of trying the public list"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  live:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run xte-node-check
        working-directory: Tools/NodeCheck
        env:
          REQUIRE_EXPLICIT_NODE: ${{ inputs.strict && '1' || '0' }}
        run: swift run -c release xte-node-check "${{ inputs.host }}" "${{ inputs.port || '443' }}" "${{ inputs.scheme || 'ssl' }}"
      - name: Live gateway sync (xte-rpc-gateway, 1000 blocks per call, no REST fallback)
        env:
          LIVE_GATEWAY: "1"
        run: swift test --filter LiveGatewayTests
